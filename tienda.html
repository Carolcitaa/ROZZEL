<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tienda — Esencias Rozzel</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="rozzel.png">
</head>

<body>
  <!-- HEADER -->
  <header class="container header">
    <div class="logo">
      <div class="mark"><img src="rozzel.png"></div>
      <div>
        <div style="font-size:16px">Rozzel</div>
        <div style="font-size:12px;color:#6b6b6b">Bienestar</div>
      </div>
    </div>

    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="servicios.html">Servicios</a>
      <a href="theta.html">ThetaHealing</a>
      <a href="tienda.html">Esencias</a>
      <a href="contacto.html">Contacto</a>
      <a href="registro.html">Registro</a>
    </nav>
  </header>

  <!-- MAIN -->
  <main class="container">

    <section class="panel">
      <h1>Esencias artesanales</h1>
      <p>Mezclas creadas con intención: aromaterapia práctica para el día a día. Selecciona y agrégalos al carrito.</p>

      <div class="product-grid" id="lista"></div>

        
      <!-- CARRITO -->
      <div id="cart" class="panel" style="margin-top:18px" aria-live="polite">
        <h3>Carrito</h3>
        <div id="cart-items">No hay productos.</div>
        <div id="cart-total"></div>
        <button class="btn btn-primary" style="margin-top:8px" onclick="checkout()">Pagar</button>
      </div>

    </section>

    <footer class="footer container">© Rozzel Bienestar</footer>
  </main>

  <!-- CARRITO LÓGICA -->
  <script>
    let cart = [];

    function addToCart(name, price) {
      cart.push({ name, price });
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById('cart-items');

      if (cart.length === 0) {
        list.innerHTML = 'No hay productos.';
      } else {
        list.innerHTML = cart
          .map((c, i) =>
            `<div>${c.name} — $${c.price} MXN 
              <button class="btn-small" onclick="removeItem(${i})">x</button>
            </div>`
          ).join('');
      }

      const total = cart.reduce((s, c) => s + c.price, 0);
      document.getElementById('cart-total').innerText =
        cart.length ? `Total: $${total} MXN` : '';
    }

    function removeItem(i) {
      cart.splice(i, 1);
      renderCart();
    }

    function checkout() {
      if (cart.length === 0) {
        alert('El carrito está vacío.');
        return;
      }
      alert('Pago simulado. Integrar pasarela en producción.');
      cart = [];
      renderCart();
    }
  </script>

  <script type="module">
  import { cargarProductos } from "./tienda.js";

  const lista = document.getElementById("lista");

  cargarProductos((productos) => {
    lista.innerHTML = "";
    productos.forEach((p) => {
      lista.innerHTML += `
        <div class="product">
          <img src="${p.imagen}"   style="width:80%;border-radius:10px">
          <h4>${p.nombre} - ${p.tamaño}</h4>
          <p>${p.descripcion}</p>
          <div class="price">$${p.precio} MXN</div>
          <button class="btn" onclick="addToCart(${p.nombre}, ${p.tamaño} ,${p.categoria})">Agregar</button>
        </div>

      `;
    });
  });
</script>

</body>
</html>
